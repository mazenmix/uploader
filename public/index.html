<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MX Files</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="MX Files home">
      <span class="brand-mark">MX</span>
      <span class="brand-copy"><strong>MX FILES</strong><small>MazenmiX</small></span>
    </a>
    <button class="ghost small" id="logoutBtn" type="button">Lock</button>
  </header>

  <main class="shell">
    <section class="upload-card" id="dropZone" tabindex="0" aria-label="Upload files">
      <input id="fileInput" type="file" multiple hidden>
      <button class="primary" id="selectBtn" type="button">Select files</button>
    </section>

    <section class="queue" id="uploadQueue" hidden></section>

    <section class="stats-grid" aria-label="Storage overview">
      <article class="stat-card storage-card">
        <div class="stat-top"><span>Storage</span><strong id="storageUsed">—</strong></div>
        <div class="meter"><i id="storageMeter"></i></div>
        <small id="storageCaption">10 GB free-tier reference</small>
      </article>
      <article class="stat-card count-card">
        <span>Files</span>
        <strong id="fileCount">—</strong>
        <small>Hosted in MX Files</small>
      </article>
    </section>

    <section class="files-panel">
      <div class="panel-head">
        <div class="panel-title"><span class="eyebrow">FILES</span><h2>Your uploads</h2></div>
        <div class="toolbar">
          <label class="search" aria-label="Search files"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search" autocomplete="off"></label>
          <button class="ghost" id="refreshBtn" type="button">Refresh</button>
        </div>
      </div>
      <div id="fileList" class="file-list"><div class="empty-state">Unlock MX Files to load your storage.</div></div>
    </section>
  </main>

  <footer>MazenmiX</footer>

  <div class="modal-backdrop" id="loginModal">
    <form class="login-card" id="loginForm">
      <span class="brand-mark large">MX</span>
      <div class="eyebrow">ADMIN ACCESS</div>
      <h2>Unlock MX Files</h2>
      <p>Enter your admin key to manage uploads.</p>
      <input id="adminKey" type="password" placeholder="Admin key" required autocomplete="current-password">
      <button class="primary wide" type="submit">Unlock</button>
      <div class="form-error" id="loginError"></div>
    </form>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
