<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><meta name="color-scheme" content="dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>MX File</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="shortcut icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/dashboard.css"><link rel="stylesheet" href="/action-icons.css"><link rel="stylesheet" href="/responsive-polish.css"><link rel="stylesheet" href="/folder-actions.css"><link rel="stylesheet" href="/mx-polish.css?v=20261003-1"><link rel="stylesheet" href="/mx-features.css?v=20261003-1"><link rel="stylesheet" href="/mx-reactive.css?v=20261003-2"><link rel="stylesheet" href="/drive-redesign.css?v=20261004-1"><link rel="stylesheet" href="/drive-fix.css?v=20261004-2"></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">MX</span><span class="brand-copy"><strong>MX FILE</strong><small>MazenmiX</small></span></a><nav class="topnav"><button class="nav-btn active" data-topview="files"><span>▣</span>Files</button><button class="nav-btn" data-topview="folders"><span>▢</span>Folders</button><button class="nav-btn" data-topview="shared"><span>↗</span>Shared</button><button class="nav-btn" data-topview="trash"><span>♲</span>Trash</button><button class="nav-btn" data-topview="activity"><span>◷</span>Activity</button></nav><div class="top-actions"><label class="global-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search files..." autocomplete="off"></label><button class="profile-btn" id="profileBtn">M</button></div></header>
