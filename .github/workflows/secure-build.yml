name: MX File secure asset build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-secure-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build obfuscated website
        run: npm run build
      - name: Validate generated files
        run: |
          test -f dist/index.html
          test -f dist/dashboard.js
          test -z "$(find dist -type f -name '*.map' -print -quit)"
          node --check dist/dashboard.js
